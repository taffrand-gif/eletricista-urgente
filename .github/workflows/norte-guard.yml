name: Norte Guard (warning)

# Garde-fou anti-régression en mode AVERTISSEMENT : ne bloque jamais le merge.
# Il annote la PR avec les constats situés sur les lignes ajoutées/modifiées.
# Passage en strict = décision séparée (--strict).
on:
  pull_request:
    branches: [ main ]

jobs:
  guard:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Norte Guard (warning)
        run: node .github/norte-guard/norte-guard.mjs --changed --added-only --base origin/${{ github.base_ref }} --json guard-report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: norte-guard-report
          path: guard-report.json
          if-no-files-found: ignore
